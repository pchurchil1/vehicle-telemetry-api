name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: telemetry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d telemetry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:////tmp/vehicle_telemetry_api_test.db
          ENVIRONMENT: test
        run: pytest -q

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql+psycopg2://app:app@localhost:5432/telemetry_test
          DATABASE_URL_TEST: postgresql+psycopg2://app:app@localhost:5432/telemetry_test
          ENVIRONMENT: test
          RUN_POSTGRES_TESTS: "1"
        run: pytest -q -m postgres --no-cov
